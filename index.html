<!DOCTYPE html>
<html>

<head>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

	<!-- Google Font -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">

	<!-------->

	<style>
		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}


		.navMenu {
			font-family: 'Advent Pro', sans-serif;
			padding: 8px;
			text-align: center;
			margin: 7px auto;
			width: fit-content;
		}

		.navMenu a {
			color: #a16b55;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 6px;
		}

		.background {
			background-color: #f5ece7;
		}

		.border {
			border: 2px solid #a16b55;

		}

		.navMenu a:hover {

			color: #a16b55;
		}
	</style>
</head>

<body>

	<nav class="navMenu  border">
		<a id="primeiro" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house"></i> Página Inicial</a>
		<a id="segundo" onclick="navigate(this.id)" href="#"> <i class="fa-regular fa-calendar"></i> Schedule</a>
		<a id="terceiro" onclick="navigate(this.id)" href="#"> <i class="fa-regular fa-heart"></i> Looks</a>
		<a id="quarto" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-list-check"></i> Tarefas</a>
		<a id="quinto" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-gem"></i> Anel</a>



	</nav>


	<script>

		let direction = "horizontal";
		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>.navMenu a {display: block; text-align:left; margin:7px} i{width:15px; margin-right:5px} .navMenu{margin:3px}</style>`)
		}


		function navigate(id) {

			if (id == 'primeiro')
				window.open("https://www.notion.so/med26/f-o-r-m-a-t-u-r-a-2d96f65f7fbd8055903bda5996d2d6c5?source=copy_link", '_blank').focus();
		
			else if (id == "segundo")
				window.open("https://www.notion.so/med26/Planejamento-2d96f65f7fbd81bab0a7ef0612ebd043?source=copy_link", '_blank').focus();

			else if (id == "terceiro")
				window.open("https://www.notion.so/med26/Looks-2e16f65f7fbd803781b7e5334ddfd98b?source=copy_link", '_blank').focus();

			else if (id == "quarto")
				window.open("https://www.notion.so/med26/Tarefas-2e16f65f7fbd8017ad1fdbb3a6f57a36?source=copy_link", '_blank').focus();

			else if (id == "quinto")
				window.open("https://www.notion.so/med26/Anel-2e16f65f7fbd80fbad9bd2ea339a59d7?source=copy_link", '_blank').focus();
		}
	</script>


</body>

</html>
