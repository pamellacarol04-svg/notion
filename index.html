<!DOCTYPE html>
<html>

<head>

	<!-- Font Awesome -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
	<!-------->

	<style>
		* {
			margin: 20;
			padding: 0;

		}


		.navMenu {
			font-family: "Bodoni Moda", serif;
			padding: 3px;
			text-align: center;

		}

		.navMenu a {
			color: #cfb09e;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 5px;
		}

		.background {
			background-color: #f4f0ee;
		}

		.border {
			border: 1.5px solid #a16b55;

		}

		.navMenu a:hover {

			color: #a16b55;
		}
	</style>
</head>

<body>

	<nav class="navMenu  border background">
		<a id="primeiro" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house"></i> Página Inicial</a>
